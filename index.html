<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#14221c" />
    <meta name="description" content="سجّل اهتمامك بجلسة مركزة أو خدمة تقنية مع خالد" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="طلبات خالد" />
    <link rel="apple-touch-icon" href="/admin-apple-touch-icon-v2-180.png" />
    <title>جلسات وخدمات خالد</title>
    <script>
      // Prevent in-app browsers from reviving an obsolete form bundle.
      if (!location.pathname.startsWith("/admin")) {
        fetch("/app-version.json", { cache: "no-store" })
          .then((response) => response.json())
          .then(({ version }) => {
            const key = "khaled-intake-version";
            const previous = localStorage.getItem(key);
            localStorage.setItem(key, version);
            if (previous && previous !== version) {
              const url = new URL(location.href);
              url.searchParams.set("v", version);
              location.replace(url.toString());
            }
          })
          .catch(() => {});
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
